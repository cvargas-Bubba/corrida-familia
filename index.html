<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0e2033"><title>Corrida Familia · Aventura en Río</title></head>
<body>
<div id="wrap">
  <div id="hud-top">
    <h1 class="wordmark">Corrida Familia<span>Aventura en Río · Phaser</span></h1>
  </div>

  <div class="screen" id="screen">
    <div id="gamehost"></div>

    <div class="touch" id="touch">
      <div class="pad">
        <button class="tbtn" id="btnLeft" aria-label="Izquierda">◀</button>
        <button class="tbtn" id="btnRight" aria-label="Derecha">▶</button>
      </div>
      <button class="tbtn jump" id="btnJump" aria-label="Saltar">⤒</button>
    </div>

    <!-- SELECT -->
    <div class="overlay" id="selectScreen">
      <h2>Elige tu héroe</h2>
      <div class="char-grid" id="charGrid"></div>
      <label class="family"><input type="checkbox" id="familyChk"> 👨‍👧‍👧 Modo familia (corren los 3)</label>
      <p>Junta 🪙 y ⭐, salta sobre los cangrejos, vence al jefe 👑 y llega a la 🏁.</p>
      <button class="btn" id="startBtn">Jugar Nivel 1</button>
    </div>

    <!-- LEVEL CLEAR -->
    <div class="overlay hidden" id="winLevel">
      <h2>¡Nivel superado! 🏁</h2>
      <p class="big" id="winLevelScore"></p>
      <button class="btn" id="nextBtn">Siguiente nivel</button>
    </div>

    <!-- WON -->
    <div class="overlay hidden" id="winAll">
      <h2>🏆 ¡Ganaron la aventura!</h2>
      <p class="big" id="winAllScore"></p>
      <button class="btn" id="againBtn">Jugar de nuevo</button>
    </div>

    <!-- OVER -->
    <div class="overlay hidden" id="overScreen">
      <h2>¡Sin vidas! 💔</h2>
      <p class="big" id="finalScore"></p>
      <div class="btn-row">
        <button class="btn" id="retryBtn">Reintentar</button>
        <button class="btn ghost" id="changeBtn">Cambiar héroe</button>
      </div>
    </div>
  </div>

  <div class="footer-row">
    <span id="tip">Flechas / A D para mover · Espacio o ↑ para saltar · en móvil usa los botones</span>
    <button class="mute-btn" id="muteBtn" aria-pressed="false">🔊 Sonido</button>
  </div>
</div>

<style>
  :root{--ink:#14243a;--br-green:#1f9e57;--br-yellow:#ffce2e;--br-blue:#2a49c9;--panel:rgba(12,28,44,.9);--stroke:#2f5f7a;--hud:#f3fbff;--hud-dim:#a9cfe0;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#0e2033;}
  #wrap{min-height:100%;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;
    padding:clamp(10px,3vw,32px);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--hud);
    background:radial-gradient(120% 90% at 70% -10%,#1a4763 0%,#0e2033 62%,#081521 100%);}
  #hud-top{width:min(900px,100%);}
  .wordmark{margin:0;font-family:"Arial Black",sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.01em;
    font-size:clamp(20px,5vw,36px);line-height:.95;background:linear-gradient(180deg,var(--br-yellow),var(--br-green) 130%);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.22);}
  .wordmark span{display:block;font-size:.36em;letter-spacing:.26em;color:var(--hud-dim);-webkit-text-fill-color:var(--hud-dim);margin-top:5px;}
  .screen{position:relative;width:min(900px,100%);aspect-ratio:800/480;border:3px solid var(--stroke);border-radius:14px;overflow:hidden;background:#7ec8ec;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.7),inset 0 0 0 2px rgba(0,0,0,.3);}
  #gamehost{position:absolute;inset:0;}
  #gamehost canvas{width:100%!important;height:100%!important;display:block;}

  .overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;
    text-align:center;background:var(--panel);backdrop-filter:blur(2px);padding:clamp(12px,3vw,22px);overflow-y:auto;transition:opacity .18s;}
  .overlay.hidden{opacity:0;pointer-events:none;}
  .overlay h2{margin:0;font-family:"Arial Black",sans-serif;font-size:clamp(18px,4.6vw,30px);text-transform:uppercase;}
  .overlay p{margin:0;color:var(--hud-dim);font-size:clamp(11px,2.8vw,14px);max-width:46ch;}
  .overlay .big{color:var(--br-yellow);font-size:clamp(14px,3.6vw,18px);font-weight:bold;}
  .family{display:inline-flex;align-items:center;gap:8px;font-size:clamp(12px,3vw,15px);color:var(--hud);cursor:pointer;background:rgba(255,255,255,.06);padding:8px 14px;border-radius:10px;border:1px solid var(--stroke);}
  .family input{width:18px;height:18px;accent-color:var(--br-yellow);}

  .char-grid{display:flex;gap:clamp(8px,2.4vw,16px);flex-wrap:wrap;justify-content:center;}
  .char-card{width:clamp(84px,22vw,116px);background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:14px;padding:11px 7px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.12s;}
  .char-card:hover{background:rgba(255,255,255,.09);transform:translateY(-2px);}
  .char-card.selected{border-color:var(--br-yellow);background:rgba(255,206,46,.12);}
  .avatar{width:clamp(48px,12vw,62px);height:clamp(48px,12vw,62px);border-radius:50%;border:3px solid rgba(255,255,255,.7);overflow:hidden;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .char-name{font-weight:bold;font-size:clamp(11px,2.8vw,14px);}

  .btn{font-family:"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(12px,3vw,15px);color:var(--ink);background:var(--br-yellow);border:none;border-radius:9px;padding:11px 26px;cursor:pointer;box-shadow:0 4px 0 #c79a15;transition:.06s;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c79a15;}
  .btn.ghost{background:transparent;color:var(--hud);box-shadow:none;border:2px solid var(--stroke);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  .footer-row{width:min(900px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(10px,2.4vw,12px);color:var(--hud-dim);}
  .mute-btn{font-family:inherit;color:var(--hud-dim);background:transparent;border:1px solid var(--stroke);border-radius:7px;padding:5px 12px;cursor:pointer;}

  .touch{position:absolute;inset:auto 0 0 0;z-index:8;display:none;justify-content:space-between;padding:12px;pointer-events:none;}
  .touch .pad{display:flex;gap:10px;}
  .tbtn{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(12,28,44,.5);color:#fff;font-size:24px;user-select:none;touch-action:none;}
  .tbtn.jump{background:rgba(31,158,87,.6);width:70px;height:70px;}
  .tbtn:active{background:rgba(255,206,46,.6);}
  .touch.show{display:flex;}
  @media (pointer:fine) and (min-width:761px){.touch.show{display:none;}}
  @media (max-width:640px){#wrap{padding:8px;}.screen{aspect-ratio:auto;height:min(70vh,90vw + 120px);min-height:400px;}}
</style>

  // ---------- sound ----------
  let actx=null, muted=false;
  function ensureAudio(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(actx&&actx.state==="suspended")actx.resume(); }
  function beep(f,d,type="square",vol=.05,to=null){ if(muted||!actx)return; const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(); o.type=type;o.frequency.setValueAtTime(f,t); if(to)o.frequency.exponentialRampToValueAtTime(to,t+d); g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02); }
  function cheer(d,vol){ if(muted||!actx)return; const t=actx.currentTime,len=Math.floor(actx.sampleRate*d),b=actx.createBuffer(1,len,actx.sampleRate),da=b.getChannelData(0); for(let i=0;i<len;i++)da[i]=Math.random()*2-1; const s=actx.createBufferSource();s.buffer=b; const bp=actx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1100;bp.Q.value=.7; const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(bp).connect(g).connect(actx.destination);s.start(t);s.stop(t+d); }
  function speak(txt){ try{ if(muted||!("speechSynthesis"in window))return; const u=new SpeechSynthesisUtterance(txt);u.lang="es-ES";u.rate=.9;u.pitch=1.15; speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }
  const sfx={ jump:()=>beep(430,.12,"square",.05,720), coin:()=>{beep(1050,.07,"square",.045);setTimeout(()=>beep(1400,.09,"square",.045),55);},
    star:()=>{beep(1180,.08,"square",.05);setTimeout(()=>beep(1560,.12,"square",.05),80);}, stomp:()=>beep(320,.12,"square",.05,120),
    hurt:()=>beep(200,.3,"sawtooth",.06,60), gol:()=>{cheer(1.3,.09);[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.24,"triangle",.06),i*120));speak("¡Gooool!");} };

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);

  const touchEl=$("touch"), familyChk=$("familyChk");
  const inputState = { left:false, right:false, jump:false, jumpEdge:false };

  function buildCards(){
    const grid=$("charGrid"); grid.innerHTML="";
    CHARS.forEach((c,i)=>{
      const card=document.createElement("div"); card.className="char-card"+(i===RUN_STATE.charIdx?" selected":""); card.dataset.idx=i;
      card.innerHTML=`<div class="avatar" style="background-image:url(${HEROES[c.id]||""})">${HEROES[c.id]?"":c.emoji}</div><div class="char-name">${c.name}</div>`;
      card.addEventListener("click",()=>{ RUN_STATE.charIdx=i; [...grid.children].forEach(k=>k.classList.toggle("selected",+k.dataset.idx===i)); });
      grid.appendChild(card);
    });
  }
  function hideOverlays(){ Object.values(overlays).forEach(o=>o.classList.add("hidden")); }
  function showOverlay(o){ hideOverlays(); o.classList.remove("hidden"); }

  $("muteBtn").addEventListener("click",()=>{ muted=!muted; $("muteBtn").textContent=muted?"🔇 Silencio":"🔊 Sonido"; });
  function bindHold(el,on,off){ el.addEventListener("pointerdown",e=>{e.preventDefault();ensureAudio();on();}); ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();off();})); }
  bindHold($("btnLeft"),()=>inputState.left=true,()=>inputState.left=false);

  // ---------- Phaser ----------
  let game=null;

    ensureAudio(); hideOverlays(); touchEl.classList.add("show");

      game = new Phaser.Game({
        type:Phaser.AUTO, parent:"gamehost", width:GW, height:GH,
        backgroundColor:"#7ec8ec",
        physics:{ default:"arcade", arcade:{ gravity:{y:GRAV}, debug:false } },
        scale:{ mode:Phaser.Scale.RESIZE, autoCenter:Phaser.Scale.CENTER_BOTH },
        scene:[BootScene, PlayScene]
      });
    } else {
      game.scene.stop("PlayScene"); game.scene.start("PlayScene");

  }

  class BootScene extends Phaser.Scene {
    constructor(){ super("BootScene"); }
    preload(){ CHARS.forEach(c=>{ if(HEROES[c.id]) this.load.image("face_"+c.id, HEROES[c.id]); }); }
    create(){ this.scene.start("PlayScene"); }
  }

  class PlayScene extends Phaser.Scene {
    constructor(){ super("PlayScene"); }
    create(){
      const S=RUN_STATE; this.lv=LEVELS[S.level]; this.celebrating=false; this.dead=false; this.runPhase=0;
      this.buildTextures();
      this.buildBackground();
      this.buildLevel();
      this.buildPlayer();
      this.buildHUD();
      this.setupInput();
      this.cameras.main.setBounds(0,0,this.lv.w*T,GH);
      this.cameras.main.startFollow(this.player,true,0.14,0.14);
      this.cameras.main.setDeadzone(140,GH);
    }

    // -- generated textures for coin/star/confetti/crab --
    buildTextures(){
      if(!this.textures.exists("coin")){ const g=this.make.graphics({x:0,y:0,add:false}); g.fillStyle(0xf2b90f,1);g.fillEllipse(11,13,18,22); g.fillStyle(0xffe07a,1);g.fillEllipse(11,13,9,15); g.generateTexture("coin",22,26); g.destroy(); }
      if(!this.textures.exists("confetti")){ const g=this.make.graphics({x:0,y:0,add:false}); g.fillStyle(0xffffff,1);g.fillRect(0,0,6,6); g.generateTexture("confetti",6,6); g.destroy(); }
      // circular head textures
      CHARS.forEach(c=>{
        const key="head_"+c.id;
        if(this.textures.exists(key)) return;
        if(this.textures.exists("face_"+c.id)){
          const src=this.textures.get("face_"+c.id).getSourceImage();
          const sz=96, cv=this.textures.createCanvas(key,sz,sz), cx=cv.getContext();
          cx.save();cx.beginPath();cx.arc(sz/2,sz/2,sz/2,0,Math.PI*2);cx.clip();
          const iw=src.width,ih=src.height,sc=Math.max(sz/iw,sz/ih),dw=iw*sc,dh=ih*sc;
          cx.drawImage(src,(sz-dw)/2,(sz-dh)/2,dw,dh); cx.restore();
          cx.lineWidth=6;cx.strokeStyle="#ffffff";cx.beginPath();cx.arc(sz/2,sz/2,sz/2-3,0,Math.PI*2);cx.stroke(); cv.refresh();
        }
      });
      if(!this.textures.exists("star")){ const g=this.make.graphics({x:0,y:0,add:false}); g.fillStyle(0xffd23f,1); const r=11,ri=5; g.beginPath();
        for(let i=0;i<10;i++){ const rr=i%2?ri:r,a=Math.PI/5*i-Math.PI/2; const x=12+Math.cos(a)*rr,y=12+Math.sin(a)*rr; i?g.lineTo(x,y):g.moveTo(x,y);} g.closePath();g.fillPath(); g.generateTexture("star",24,24); g.destroy(); }
    }

    buildBackground(){
      const cam=this.cameras.main;
      const sky=this.add.graphics().setScrollFactor(0); sky.fillGradientStyle(0x3f9fd8,0x3f9fd8,0xcfeefb,0xcfeefb,1); sky.fillRect(0,0,GW,GH);
      // sun
      const sun=this.add.circle(640,80,32,0xfff3c4).setScrollFactor(0.1); this.add.circle(640,80,90,0xfff0b4,0.18).setScrollFactor(0.1);
      // hills (two parallax layers via graphics drawn wide)
      const mkHills=(color,baseY,amp,sf)=>{ const g=this.add.graphics().setScrollFactor(sf); g.fillStyle(color,1); g.beginPath(); g.moveTo(0,GH);
        for(let x=0;x<=GW*1.6;x+=16){ const y=baseY-(Math.sin(x*0.006)*0.5+0.5)*amp; g.lineTo(x,y);} g.lineTo(GW*1.6,GH);g.closePath();g.fillPath(); };
      mkHills(0x5aa9c0,300,120,0.15); mkHills(0x3f8ea3,340,150,0.3);
    }

    buildLevel(){
      const lv=this.lv, w=lv.w;
      this.grid=[]; for(let r=0;r<ROWS;r++){ let src=r<10?(lv.rows[r]||""):groundRow(w,lv.pits); const row=[]; for(let c=0;c<w;c++)row.push(src[c]||" "); this.grid.push(row); }
      this.solids=this.physics.add.staticGroup();
      this.oneways=this.physics.add.staticGroup();
      const terr=this.add.graphics();
      for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<w;tx++){
        const ch=this.grid[ty][tx]; if(ch===" ")continue; const x=tx*T,y=ty*T;
        if(ch==="#"||ch==="B"){
          const body=this.add.rectangle(x+T/2,y+T/2,T,T); this.physics.add.existing(body,true); this.solids.add(body); body.setVisible(false);
          if(ch==="#"){ terr.fillStyle(0xd8b25f,1);terr.fillRect(x,y,T,T); terr.fillStyle(0xe8cd83,1);terr.fillRect(x,y,T,6); terr.fillStyle(0xb98e3d,1);terr.fillRect(x,y+T-5,T,5); }
          else { terr.fillStyle(0xc76b3a,1);terr.fillRect(x,y,T,T); terr.fillStyle(0xe08a54,1);terr.fillRect(x+1,y+1,T-2,6); terr.lineStyle(2,0x8f4a24,1);terr.strokeRect(x+2,y+2,T-4,T-4); }
        } else if(ch==="="){
          const body=this.add.rectangle(x+T/2,y+5,T,10); this.physics.add.existing(body,true); body.body.checkCollision.down=false; body.body.checkCollision.left=false; body.body.checkCollision.right=false; this.oneways.add(body); body.setVisible(false);
          terr.fillStyle(0x9a6a3a,1);terr.fillRect(x,y,T,10); terr.fillStyle(0xb98c55,1);terr.fillRect(x,y,T,3);
        } else if(ch==="^"){
          terr.fillStyle(0xb8c0c8,1); for(let k=0;k<4;k++){ terr.beginPath();terr.moveTo(x+k*10,y+T);terr.lineTo(x+k*10+5,y+T-16);terr.lineTo(x+k*10+10,y+T);terr.closePath();terr.fillPath();}
        }
      }
      // flag
      const fx=lv.flag[0]*T, fy=lv.flag[1]*T;
      const fg=this.add.graphics(); fg.fillStyle(0xe8e4dc,1);fg.fillRect(fx+18,fy-T*2,4,T*3); fg.fillStyle(0x1f9e57,1);fg.fillTriangle(fx+22,fy-T*2,fx+48,fy-T*2+10,fx+22,fy-T*2+20);
      this.flagZone=this.add.zone(fx+20,fy-T,30,T*2); this.physics.add.existing(this.flagZone,true);

      // coins & stars
      this.coinGroup=this.physics.add.staticGroup(); this.starGroup=this.physics.add.staticGroup();
      lv.coins.forEach(([cx,cy])=>this.coinGroup.create(cx*T+T/2,cy*T+T/2,"coin"));
      lv.stars.forEach(([cx,cy])=>this.starGroup.create(cx*T+T/2,cy*T+T/2,"star"));

      // spikes as overlap zones
      this.spikeZones=this.physics.add.staticGroup();
      for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<w;tx++) if(this.grid[ty][tx]==="^"){ const z=this.add.zone(tx*T+T/2,ty*T+T-8,T-6,14); this.physics.add.existing(z,true); this.spikeZones.add(z); }

      // enemies
      this.enemyGroup=this.physics.add.group();
      lv.enemies.forEach(([ex,ey,type])=>{ const boss=type==="boss"; const e=this.makeCrab(ex*T+T/2, ey*T, boss); this.enemyGroup.add(e); });
    }

    makeCrab(x,y,boss){
      const w=boss?46:30,h=boss?40:28, color=boss?0xc0392b:0xe05a3a;
      const cont=this.add.container(x,y);
      const body=this.add.ellipse(0,0,w,h*0.9,color);
      const eyeL=this.add.circle(-w*0.18,-2,3,0xffffff), eyeR=this.add.circle(w*0.18,-2,3,0xffffff);
      const pL=this.add.circle(-w*0.18,-2,1.5,0x111111), pR=this.add.circle(w*0.18,-2,1.5,0x111111);
      const clawL=this.add.rectangle(-w/2-2,2,7,6,color), clawR=this.add.rectangle(w/2+2,2,7,6,color);
      cont.add([clawL,clawR,body,eyeL,eyeR,pL,pR]);
      if(boss){ const crown=this.add.star(0,-h*0.55,5,4,9,0xffce2e); cont.add(crown); }
      this.physics.world.enable(cont);
      cont.body.setSize(w,h).setOffset(-w/2,-h/2);
      cont.body.setCollideWorldBounds(false);
      cont.dir=-1; cont.speed=boss?70:100; cont.hp=boss?3:1; cont.boss=boss; cont.w=w; cont.h=h; cont.stun=0;
      cont.body.setVelocityX(cont.dir*cont.speed);
      return cont;
    }

    buildHero(x,y,char,withBody){
      const cont=this.add.container(x,y);
      // legs & arms pivot from the top (hip/shoulder) so they can swing
      const legL=this.add.rectangle(-5,12,7,12,0x33240f).setOrigin(0.5,0);
      const legR=this.add.rectangle(5,12,7,12,0x33240f).setOrigin(0.5,0);
      // two-tone arm: sleeve (jersey) with a skin forearm tip, grouped so they swing together
      const armL=this.add.container(-14,1,[ this.add.rectangle(0,0,5,9,char.jersey).setOrigin(0.5,0), this.add.rectangle(0,9,5,5,0xd7a06a).setOrigin(0.5,0) ]);
      const armR=this.add.container(14,1,[ this.add.rectangle(0,0,5,9,char.jersey).setOrigin(0.5,0), this.add.rectangle(0,9,5,5,0xd7a06a).setOrigin(0.5,0) ]);
      const torso=this.add.rectangle(0,10,26,20,char.jersey);
      const stripe=this.add.rectangle(0,16,26,4,char.stripe);
      const head=this.textures.exists("head_"+char.id) ? this.add.image(0,-14,"head_"+char.id).setDisplaySize(40,40)
                 : this.add.circle(0,-14,18,0xe0a878);
      cont.add([legL,legR,armL,armR,torso,stripe,head]);
      cont.headRef=head; cont.legL=legL; cont.legR=legR; cont.armL=armL; cont.armR=armR; cont.baseHeadY=-14;
      if(withBody){ this.physics.world.enable(cont); cont.body.setSize(30,54).setOffset(-15,-30); }
      return cont;
    }
    poseHero(h,phase,state){
      if(!h.legL)return;
      if(state==="run"){
        const s=Math.sin(phase), c=Math.cos(phase);
        h.legL.angle=s*40; h.legR.angle=-s*40;
        h.armL.angle=-s*34; h.armR.angle=s*34;
        h.headRef.y=h.baseHeadY-Math.abs(c)*2;
      } else if(state==="air"){
        h.legL.angle=24; h.legR.angle=-14;
        h.armL.angle=-40; h.armR.angle=40;
        h.headRef.y=h.baseHeadY;
      } else { // idle: respiración leve
        const b=Math.sin(phase*0.5);
        h.legL.angle=0; h.legR.angle=0;
        h.armL.angle=5; h.armR.angle=-5;
        h.headRef.y=h.baseHeadY-Math.abs(b)*1;
      }
    }

    buildPlayer(){
      const S=RUN_STATE, sp=this.lv.spawn, char=CHARS[S.charIdx];
      this.player=this.buildHero(sp[0]*T, sp[1]*T-6, char, true);
      this.player.setDepth(5); this.player.invuln=40;
      this.physics.add.collider(this.player,this.solids);
      this.physics.add.collider(this.player,this.oneways);
      this.physics.add.overlap(this.player,this.coinGroup,(p,c)=>this.collectCoin(c));
      this.physics.add.overlap(this.player,this.starGroup,(p,s)=>this.collectStar(s));
      this.physics.add.overlap(this.player,this.spikeZones,()=>this.hurt());
      this.physics.add.overlap(this.player,this.flagZone,()=>this.reachFlag());
      this.physics.add.collider(this.enemyGroup,this.solids);
      this.physics.add.overlap(this.player,this.enemyGroup,(p,e)=>this.hitEnemy(e));

      // family followers (cosmetic, trail)
      this.followers=[];
      if(S.family){
        this.trail=[];
        const others=CHARS.filter((c,i)=>i!==S.charIdx);
        others.forEach((c,k)=>{ const f=this.buildHero(sp[0]*T,sp[1]*T-6,c,false); f.setDepth(4-k); f.delay=(k+1)*12; this.followers.push(f); });
      }
    }

    buildHUD(){
      const S=RUN_STATE;
      this.hud=this.add.text(12,10,"",{fontFamily:"Trebuchet MS, monospace",fontSize:"18px",color:"#0d2536",fontStyle:"bold"}).setScrollFactor(0).setDepth(50);
      this.hud2=this.add.text(11,9,"",{fontFamily:"Trebuchet MS, monospace",fontSize:"18px",color:"#fff6d8",fontStyle:"bold"}).setScrollFactor(0).setDepth(51);
      this.refreshHUD();
      this.banner=this.add.text(GW/2,GH/2-40,"Nivel "+(S.level+1),{fontFamily:"Arial Black",fontSize:"40px",color:"#ffce2e",stroke:"#0c3b5c",strokeThickness:6}).setOrigin(0.5).setScrollFactor(0).setDepth(60);
      this.tweens.add({targets:this.banner,alpha:0,delay:800,duration:600,onComplete:()=>this.banner.destroy()});
    }
    refreshHUD(){ const S=RUN_STATE; const txt=`❤ ${S.lives}    🪙 ${S.coins}   ⭐ ${S.stars}    NIVEL ${S.level+1}   ${S.score} pts`; this.hud.setText(txt); this.hud2.setText(txt); }

    setupInput(){
      this.keys=this.input.keyboard.addKeys({left:Phaser.Input.Keyboard.KeyCodes.LEFT,right:Phaser.Input.Keyboard.KeyCodes.RIGHT,a:Phaser.Input.Keyboard.KeyCodes.A,d:Phaser.Input.Keyboard.KeyCodes.D,up:Phaser.Input.Keyboard.KeyCodes.UP,w:Phaser.Input.Keyboard.KeyCodes.W,space:Phaser.Input.Keyboard.KeyCodes.SPACE});
      this.jumpHeld=false;
    }

    collectCoin(c){ if(!c.active)return; c.destroy(); RUN_STATE.coins++; RUN_STATE.score+=50; sfx.coin(); this.refreshHUD(); this.puff(c.x,c.y,0xffd23f); }
    collectStar(s){ if(!s.active)return; s.destroy(); RUN_STATE.stars++; RUN_STATE.score+=200; sfx.star(); this.refreshHUD(); this.puff(s.x,s.y,0xfff2b0); }
    puff(x,y,color){ const p=this.add.particles(x,y,"confetti",{lifespan:400,speed:{min:40,max:120},scale:{start:1,end:0},quantity:8,tint:color}); this.time.delayedCall(420,()=>p.destroy()); }

    hitEnemy(e){
      if(this.celebrating||this.dead||!e.active)return;
      const pb=this.player.body, eb=e.body;
      const stomping = pb.velocity.y>0 && (pb.bottom - eb.top) < 22;
      if(stomping){
        e.hp--; pb.setVelocityY(JUMPV*0.6); sfx.stomp(); this.puff(e.x,e.y-e.h/2,0xffd23f);
        if(e.hp<=0){ RUN_STATE.score+=e.boss?500:150; if(e.boss){ this.bossDefeated(e); } e.destroy(); }
        else { RUN_STATE.score+=60; e.stun=18; e.setScale(1,0.7); this.time.delayedCall(180,()=>e.active&&e.setScale(1,1)); }
        this.refreshHUD();
      } else if(this.player.invuln<=0){ this.hurt(this.player.x<e.x?-1:1); }
    }
    bossDefeated(e){ sfx.gol(); this.celebrate(); }

    hurt(dir=1){
      if(this.celebrating||this.dead||this.player.invuln>0)return;
      RUN_STATE.lives--; sfx.hurt(); this.player.invuln=90; this.refreshHUD();
      this.player.body.setVelocity(dir*160,-260);
      if(RUN_STATE.lives<=0){ this.dead=true; this.time.delayedCall(400,()=>this.gameOver()); }
    }

    reachFlag(){ if(this.celebrating||this.dead)return; sfx.gol(); this.celebrate(true); }

    celebrate(levelEnd){
      if(this.celebrating)return; this.celebrating=true;
      this.player.body.setVelocity(0,0); this.player.body.allowGravity=false;
      // mueca de festejo: rebote + giro de cabeza + confeti + estrellas + burbuja
      this.tweens.add({targets:this.player,scaleX:1.25,scaleY:1.25,yoyo:true,repeat:5,duration:170});
      if(this.player.headRef) this.tweens.add({targets:this.player.headRef,angle:360,duration:700,repeat:1});
      const bubble=this.add.text(this.player.x,this.player.y-52,"¡BIEEN! 🎉",{fontFamily:"Arial Black",fontSize:"20px",color:"#fff",stroke:"#1f9e57",strokeThickness:5}).setOrigin(0.5).setDepth(70);
      this.tweens.add({targets:bubble,y:bubble.y-16,alpha:0,delay:900,duration:700});
      const conf=this.add.particles(this.player.x,this.player.y-30,"confetti",{lifespan:900,speed:{min:80,max:220},angle:{min:200,max:340},gravityY:300,scale:{start:1.4,end:0},quantity:3,frequency:30,tint:[0xffce2e,0x1f9e57,0x2a49c9,0xffffff]});
      // sparkle stars orbiting
      for(let i=0;i<3;i++){ const st=this.add.image(this.player.x,this.player.y-20,"star").setDepth(69); this.tweens.add({targets:st,x:this.player.x+Math.cos(i*2.1)*30,y:this.player.y-20+Math.sin(i*2.1)*30,alpha:0,scale:0.3,delay:i*90,duration:800,onComplete:()=>st.destroy()}); }
      this.time.delayedCall(1500,()=>{ conf.destroy(); this.finishLevel(levelEnd); });
    }
    finishLevel(levelEnd){
      touchEl.classList.remove("show");
      if(RUN_STATE.score>best){ best=RUN_STATE.score; localStorage.setItem("cfam.best",String(best)); }
      if(RUN_STATE.level>=LEVELS.length-1){
        $("winAllScore").textContent=`🪙 ${RUN_STATE.coins}  ⭐ ${RUN_STATE.stars}  ·  ${RUN_STATE.score} pts  ·  Récord ${best}`;
        showOverlay(overlays.winAll);
      } else {
        $("winLevelScore").textContent=`🪙 ${RUN_STATE.coins}  ⭐ ${RUN_STATE.stars}  ·  ${RUN_STATE.score} pts`;
        showOverlay(overlays.winLevel);
      }
    }
    gameOver(){
      touchEl.classList.remove("show");
      if(RUN_STATE.score>best){ best=RUN_STATE.score; localStorage.setItem("cfam.best",String(best)); }
      $("finalScore").textContent=`🪙 ${RUN_STATE.coins}  ⭐ ${RUN_STATE.stars}  ·  ${RUN_STATE.score} pts  ·  Récord ${best}`;
      showOverlay(overlays.over);
    }

    update(time,delta){
      if(this.dead||this.celebrating){ if(this.player.body) this.player.body.setVelocityX(0); return; }
      const S=RUN_STATE, kb=this.keys, b=this.player.body;
      const left = kb.left.isDown||kb.a.isDown||inputState.left;
      const right= kb.right.isDown||kb.d.isDown||inputState.right;
      const jumpDown = kb.space.isDown||kb.up.isDown||kb.w.isDown||inputState.jump;

      if(left){ b.setVelocityX(-RUN); this.player.scaleX=-1; }
      else if(right){ b.setVelocityX(RUN); this.player.scaleX=1; }
      else b.setVelocityX(0);

      const grounded=b.blocked.down||b.touching.down;
      const jumpPressed = (jumpDown && !this.jumpHeld) || inputState.jumpEdge;
      inputState.jumpEdge=false;
      if(jumpPressed && grounded){ b.setVelocityY(JUMPV); sfx.jump(); }
      this.jumpHeld=jumpDown;
      // variable jump
      if(!jumpDown && b.velocity.y<0) b.setVelocityY(b.velocity.y*0.5>-120?b.velocity.y:b.velocity.y+30);
      if(b.velocity.y>MAXFALL) b.setVelocityY(MAXFALL);

      // run animation
      const speedRatio=Math.min(1,Math.abs(b.velocity.x)/RUN);
      this.runPhase += 0.45*speedRatio + 0.03;
      const pstate = !grounded ? "air" : (speedRatio>0.15 ? "run" : "idle");
      this.poseHero(this.player, this.runPhase, pstate);
      const fstate = speedRatio>0.15 ? "run" : "idle";

      // fall off world
      if(this.player.y>GH+80){ this.player.invuln=0; this.hurt(); if(!this.dead){ this.player.setPosition(this.lv.spawn[0]*T,this.lv.spawn[1]*T-6); this.player.body.setVelocity(0,0); this.player.invuln=70; } }

      if(this.player.invuln>0){ this.player.invuln--; this.player.setAlpha((this.player.invuln>>2)%2?0.4:1);} else this.player.setAlpha(1);

      // enemies AI
      this.enemyGroup.getChildren().forEach(e=>{
        if(!e.active)return; const eb=e.body;
        if(e.stun>0){ e.stun--; }
        if(eb.blocked.left){ e.dir=1; } else if(eb.blocked.right){ e.dir=-1; }
        // ledge turn
        if(eb.blocked.down){ const aheadX=e.x+e.dir*(e.w/2+4), belowY=e.y+e.h/2+6; if(!this.solidAtPx(aheadX,belowY)) e.dir*=-1; }
        eb.setVelocityX(e.dir*e.speed);
      });

      // family followers trail
      if(S.family){
        this.trail.push({x:this.player.x,y:this.player.y,fx:this.player.scaleX});
        if(this.trail.length>200)this.trail.shift();
        this.followers.forEach((f,k)=>{ const idx=this.trail.length-1-f.delay; if(idx>=0){ const t=this.trail[idx]; f.setPosition(t.x,t.y); f.scaleX=t.fx; this.poseHero(f, this.runPhase - f.delay*0.12, fstate); } });
      }
    }
    solidAtPx(px,py){ const tx=Math.floor(px/T),ty=Math.floor(py/T); if(ty<0||ty>=ROWS||tx<0||tx>=this.lv.w)return false; const ch=this.grid[ty][tx]; return ch==="#"||ch==="B"; }
  }

  // ---------- wire buttons ----------
  $("startBtn").addEventListener("click",()=>{ RUN_STATE.family=familyChk.checked; RUN_STATE.level=0; RUN_STATE.lives=3; RUN_STATE.coins=0; RUN_STATE.stars=0; RUN_STATE.score=0; startLevel(); });
  $("nextBtn").addEventListener("click",()=>{ RUN_STATE.level++; startLevel(); });
  $("againBtn").addEventListener("click",()=>{ RUN_STATE.level=0; RUN_STATE.lives=3; RUN_STATE.coins=0; RUN_STATE.stars=0; RUN_STATE.score=0; startLevel(); });
  $("retryBtn").addEventListener("click",()=>{ RUN_STATE.lives=3; startLevel(); });
  $("changeBtn").addEventListener("click",()=>{ touchEl.classList.remove("show"); showOverlay(overlays.select); });

  buildCards();
})();
</script>

</body>
